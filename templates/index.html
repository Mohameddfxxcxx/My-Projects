<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFA 101 Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-project-diagram"></i> DFA 101 Substring Visualizer</h1>
            <p class="subtitle">Step-by-step visualization of how the DFA processes strings to find '101'</p>
        </header>

        <main>
            <div class="input-section">
                <label for="binary-input">Enter a binary string (0s and 1s):</label>
                <div class="input-group">
                    <input type="text" id="binary-input" placeholder="e.g., 010101">
                    <button id="check-btn"><i class="fas fa-play"></i> Run DFA</button>
                </div>
                <div id="error-message" class="error"></div>
            </div>

            <div class="visualization-container">
                <div class="dfa-graph">
                    <h2><i class="fas fa-network-wired"></i> DFA State Diagram</h2>
                    <div class="states-container">
                        <div class="state" id="q0">q0</div>
                        <div class="arrow"></div>
                        <div class="state" id="q1">q1</div>
                        <div class="arrow"></div>
                        <div class="state" id="q2">q2</div>
                        <div class="arrow"></div>
                        <div class="state accepting" id="q3">q3</div>
                    </div>
                    <div class="transitions">
                        <div class="transition" id="t0">0</div>
                        <div class="transition" id="t1">1</div>
                        <div class="transition" id="t2">0</div>
                        <div class="transition" id="t3">0/1</div>
                        <div class="transition" id="t4">1</div>
                        <div class="transition" id="t5">0</div>
                    </div>
                </div>

                <div class="execution-section">
                    <h2><i class="fas fa-code"></i> Execution Trace</h2>
                    <div id="result-message" class="result-message"></div>
                    <div id="path-details" class="path-details"></div>
                </div>
            </div>

            <div class="examples-section">
                <h3><i class="fas fa-lightbulb"></i> Example Inputs</h3>
                <div class="examples-grid">
                    <button class="example-btn" data-example="101">101</button>
                    <button class="example-btn" data-example="0101">0101</button>
                    <button class="example-btn" data-example="1001">1001</button>
                    <button class="example-btn" data-example="101101">101101</button>
                    <button class="example-btn" data-example="000">000</button>
                    <button class="example-btn" data-example="1110111">1110111</button>
                </div>
            </div>
        </main>

        <footer>
            <p>DFA visualization tool for educational purposes</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
