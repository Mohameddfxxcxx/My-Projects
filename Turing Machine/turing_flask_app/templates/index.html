<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Machine: Binary Divisibility by 3</title>
    <!-- Link to custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="light-theme">
    <div class="container">
        <!-- Theme toggle button -->
        <div class="theme-toggle">
            <button id="theme_toggle_btn" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <!-- Header with title and subtitle -->
        <header>
            <h1>Turing Machine Simulator</h1>
            <h2>Check Binary Number Divisibility by 3</h2>
        </header>

        <!-- Input section for binary number -->
        <div class="input-section">
            <div class="input-group">
                <label for="binary_input">Enter a binary number:</label>
                <div class="input-container">
                    <input type="text" id="binary_input" placeholder="e.g., 110" />
                    <button id="run_btn"><i class="fas fa-play"></i> Run</button>
                </div>
                <div class="error-message" id="error_message"></div>
            </div>
        </div>

        <!-- Results section (hidden until computation completes) -->
        <div class="results-section" id="results_section" style="display: none;">
            <!-- Tape visualization with animation -->
            <div class="tape-visualization">
                <h3>Tape Visualization</h3>
                <div class="tape-container" id="tape_container"></div>
            </div>

            <!-- Result display -->
            <div class="result-box">
                <h3>Result</h3>
                <div class="result-content" id="result_content"></div>
            </div>

            <!-- Animated state transition diagram -->
            <div class="state-diagram">
                <h3>State Transition Diagram</h3>
                <div class="diagram-container">
                    <svg id="state_diagram"></svg>
                </div>
            </div>

            <!-- Computation steps table -->
            <div class="computation-steps">
                <h3>Computation Steps</h3>
                <table id="steps_table">
                    <thead>
                        <tr>
                            <th>Step</th>
                            <th>Head Position</th>
                            <th>State</th>
                            <th>Symbol Read</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="steps_body"></tbody>
                </table>
            </div>

            <!-- Detailed explanation -->
            <div class="explanation">
                <h3>Detailed Explanation</h3>
                <div id="explanation_content"></div>
            </div>
        </div>
    </div>

    <!-- D3.js for animated state diagram -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Link to custom JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
